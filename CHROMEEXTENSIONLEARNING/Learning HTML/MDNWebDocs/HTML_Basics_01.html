2. Text & Typography

These are your go-to elements for putting written content on the screen.
• <h1> to <h6>: Headings. <h1> is the main title of the page (use only one per page), while <h2> through <h6> are for subheadings.
• <p>: Paragraph. The standard tag for any regular body text blocks.
• <strong>: Makes text bold and tells search engines the text is important.
• <em>: Makes text italicized for emphasis.
• <br>: Forces a manual line break (moves text to the next line).

3. Links, Media & Lists

How you connect pages, display imagery, and organize items.
• <a>: The Hyperlink. Connects users to other websites or pages using the href attribute (e.g., <a href="url">Text</a>).
• <img>: Images. Displays pictures on your site using the src attribute.
• <ul> + <li>: Unordered List. Creates a bulleted list. The <ul> sets up the list, and each <li> is a line item.
• <ol> + <li>: Ordered List. Creates a numbered list (1, 2, 3...).

4. Forms & User Interaction

Whenever you need to take information from a user (logins, contact forms, searches), you will use these.
• <form>: The wrapper that bundles all input fields together to submit data.
• <input>: The data entry field. Extremely versatile depending on its type attribute (e.g., type="text", type="email", type="password", or type="checkbox").
`: Text that attaches to an input so users know what to type.
• <button>: A clickable button used to submit forms or trigger actions. -->
